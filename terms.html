<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms of use — Livescore Alerts</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#f2f5fb;--card:#ffffff;--edge:#d4e0f6;
    --blue:#1c4be0;--blue-dk:#1238bd;--navy:#141b4d;
    --text:#44507c;--muted:#7c89b4;
    --wa:#21b158;--sms:#2e83ff;--live:#e63333;
    --disp:'Syne','Baloo 2',sans-serif;
    --body:'Epilogue','Mukta',sans-serif;
    --mono:'IBM Plex Mono','Mukta',monospace;
  }
  html[lang=hi],html[lang=mr]{--disp:'Baloo 2',sans-serif;--body:'Mukta',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  ::selection{background:var(--blue);color:#fff}
  html[lang=hi] h1,html[lang=mr] h1{line-height:1.25;letter-spacing:0}
  .stadium{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(ellipse 55% 40% at 88% 0%, rgba(28,75,224,.10), transparent 65%),
    radial-gradient(ellipse 45% 35% at 5% 45%, rgba(28,75,224,.07), transparent 65%),
    linear-gradient(180deg,#f6f8fd 0%, #eef2fa 55%, #f2f5fb 100%)}
  .stadium::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(28,75,224,.18) 1.3px, transparent 1.3px);
    background-size:17px 17px;
    -webkit-mask-image:radial-gradient(ellipse 42% 34% at 92% 6%, #000, transparent 72%);
    mask-image:radial-gradient(ellipse 42% 34% at 92% 6%, #000, transparent 72%);
    pointer-events:none}
  header{display:flex;align-items:center;gap:1.6rem;padding:.85rem clamp(1rem,4vw,3.5rem);background:rgba(255,255,255,.92);border-bottom:1px solid var(--edge)}
  .brand{display:flex;align-items:center;gap:.75rem;text-decoration:none}
  .crest{width:2.7rem;height:2.9rem;flex-shrink:0;background:var(--blue);clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:#fff;letter-spacing:.02em;padding-bottom:.35rem}
  .wordmark b{display:block;font-family:'Syne',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);line-height:1}
  .wordmark span{display:block;font-family:var(--mono);font-size:.52rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:.25rem}
  .lang{display:flex;border:1px solid var(--edge);background:#fff;margin-left:auto;border-radius:999px;overflow:hidden}
  .lang button{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:#5a6b9e;background:none;border:none;cursor:pointer;padding:.45rem .75rem;border-right:1px solid var(--edge);transition:background .15s,color .15s}
  .lang button:last-child{border-right:none}
  .lang button:hover{color:var(--navy)}
  .lang button.on{background:var(--blue);color:#fff;font-weight:600}

  main{flex:1;padding:clamp(2rem,5vh,3.5rem) 1rem}
  .page{max-width:820px;margin:0 auto;background:var(--card);border:1.5px solid var(--edge);border-radius:22px;padding:clamp(1.8rem,5vw,3rem);box-shadow:0 24px 60px rgba(20,40,120,.1)}
  .page h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(1.8rem,4.5vw,2.4rem);line-height:1.12;letter-spacing:0;color:var(--navy)}
  .meta{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:.7rem 0 1.6rem}
  html[lang=hi] .meta,html[lang=mr] .meta{letter-spacing:.04em}
  .page h2{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:1.05rem;letter-spacing:.02em;color:var(--blue);margin:1.7rem 0 .5rem}
  html[lang=hi] .page h2,html[lang=mr] .page h2{letter-spacing:.02em}
  .page p{color:var(--text);font-size:.97rem;line-height:1.75;margin-bottom:.6rem}
  .page b{color:var(--navy);font-weight:600}
  .page a{color:var(--blue)}
  .back{display:inline-flex;align-items:center;gap:.55rem;margin-top:2rem;text-decoration:none;font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:.95rem;background:var(--blue);color:#fff;padding:.7rem 1.9rem;border-radius:999px;box-shadow:0 10px 26px rgba(28,75,224,.32);transition:transform .12s,box-shadow .12s,background .12s}
  .back:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(28,75,224,.42);background:var(--blue-dk)}
  footer{background:#fff;border-top:1.5px solid var(--edge)}
  .foot-bottom{padding:1.1rem clamp(1rem,4vw,3.5rem);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;max-width:1220px;margin:0 auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  html[lang=hi] .foot-bottom,html[lang=mr] .foot-bottom{letter-spacing:.04em}
  .foot-bottom .stop{color:var(--blue)}
</style>
</head>
<body>
<div class="stadium" aria-hidden="true"></div>

<header>
  <a class="brand" href="index.html">
    <span class="crest">LS</span>
    <span class="wordmark">
      <b>Livescore Alerts</b>
      <span data-i18n="brandTag">Free SMS &amp; WhatsApp</span>
    </span>
  </a>
  <div class="lang" id="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="hi">हिंदी</button>
    <button type="button" data-lang="mr">मराठी</button>
  </div>
</header>

<main>
  <article class="page">
    <h1 data-i18n="title">Terms of use</h1>
    <p class="meta" data-i18n="meta">Effective: 9 July 2026</p>
    <div data-i18n="content"></div>
    <a class="back" href="index.html" data-i18n="back">‹ Back to home</a>
  </article>
</main>

<footer>
  <div class="foot-bottom">
    <span data-i18n="footCopy">© 2026 Livescore Alerts. All rights reserved.</span>
    <span class="stop" data-i18n="footStop">Reply STOP to any alert to unsubscribe.</span>
  </div>
</footer>

<script>
  var I18N={
    en:{
      brandTag:'Free SMS &amp; WhatsApp',
      title:'Terms of use',
      meta:'Effective: 9 July 2026',
      content:
        '<h2>1. The service</h2>'+
        '<p>Livescore Alerts sends live cricket and football score messages by SMS and WhatsApp. Receiving alerts is free.</p>'+
        '<h2>2. Subscribing</h2>'+
        '<p>Sign-up is completed through the link on our home page. By subscribing you agree to receive score alerts on the mobile number you provide, and you confirm the number is yours.</p>'+
        '<h2>3. Charges</h2>'+
        '<p>We do not charge for alerts. Messages you send (for example a STOP reply) may be charged at your operator’s standard rate. WhatsApp messages use your data plan.</p>'+
        '<h2>4. Accuracy and availability</h2>'+
        '<p>Scores are provided on a best-effort basis and may occasionally be delayed, interrupted or incorrect. Do not rely on alerts where timing matters financially. We accept no liability for losses arising from delayed or incorrect scores. Livescore Alerts is an independent service and is not affiliated with any league, board, team or broadcaster.</p>'+
        '<h2>5. Acceptable use</h2>'+
        '<p>Do not use the service for anything unlawful, and do not resell or commercially redistribute alert content.</p>'+
        '<h2>6. Opt-out</h2>'+
        '<p>Reply <b>STOP</b> to any alert to end all messages immediately.</p>'+
        '<h2>7. Changes</h2>'+
        '<p>We may update these terms from time to time. The version published on this page is the one that applies. Continued use of the service after a change means you accept the updated terms.</p>'+
        '<h2>8. Contact</h2>'+
        '<p>Questions about these terms: <a href="mailto:support@yourdomain.com">support@yourdomain.com</a></p>',
      back:'‹ Back to home',
      footCopy:'© 2026 Livescore Alerts. All rights reserved.',
      footStop:'Reply STOP to any alert to unsubscribe.'
    },
    hi:{
      brandTag:'फ्री SMS और WhatsApp',
      title:'नियम व शर्तें',
      meta:'लागू: 9 जुलाई 2026',
      content:
        '<h2>1. सेवा</h2>'+
        '<p>लाइवस्कोर अलर्ट्स SMS और WhatsApp पर लाइव क्रिकेट और फुटबॉल स्कोर भेजता है। अलर्ट पाना फ्री है।</p>'+
        '<h2>2. सब्सक्रिप्शन</h2>'+
        '<p>साइन-अप हमारे होम पेज पर दिए लिंक से पूरा होता है। सब्सक्राइब करके आप अपने दिए हुए मोबाइल नंबर पर स्कोर अलर्ट पाने के लिए सहमति देते हैं, और पुष्टि करते हैं कि वह नंबर आपका है।</p>'+
        '<h2>3. शुल्क</h2>'+
        '<p>हम अलर्ट के लिए कोई शुल्क नहीं लेते। आपके भेजे मैसेज (जैसे STOP) पर आपके ऑपरेटर का सामान्य शुल्क लग सकता है। WhatsApp मैसेज आपका डेटा इस्तेमाल करते हैं।</p>'+
        '<h2>4. सटीकता और उपलब्धता</h2>'+
        '<p>स्कोर पूरी कोशिश के साथ भेजे जाते हैं, फिर भी कभी-कभी देरी, रुकावट या गलती हो सकती है। जहां समय का आर्थिक महत्व हो वहां अलर्ट पर निर्भर न रहें। देर से या गलत स्कोर से हुए किसी नुकसान की जिम्मेदारी हम नहीं लेते। लाइवस्कोर अलर्ट्स एक स्वतंत्र सेवा है और किसी लीग, बोर्ड, टीम या ब्रॉडकास्टर से जुड़ी नहीं है।</p>'+
        '<h2>5. उचित उपयोग</h2>'+
        '<p>सेवा का इस्तेमाल किसी गैरकानूनी काम के लिए न करें, और अलर्ट की सामग्री को बेचें या व्यावसायिक रूप से आगे न बांटें।</p>'+
        '<h2>6. ऑप्ट-आउट</h2>'+
        '<p>सभी मैसेज तुरंत बंद करने के लिए किसी भी अलर्ट पर <b>STOP</b> भेजें।</p>'+
        '<h2>7. बदलाव</h2>'+
        '<p>हम समय-समय पर इन शर्तों को बदल सकते हैं। इस पेज पर प्रकाशित संस्करण ही लागू होता है। बदलाव के बाद सेवा का इस्तेमाल जारी रखने का मतलब है कि आप नई शर्तें स्वीकार करते हैं।</p>'+
        '<h2>8. संपर्क</h2>'+
        '<p>इन शर्तों के बारे में सवाल: <a href="mailto:support@yourdomain.com">support@yourdomain.com</a></p>',
      back:'‹ होम पर वापस',
      footCopy:'© 2026 लाइवस्कोर अलर्ट्स। सर्वाधिकार सुरक्षित।',
      footStop:'अनसब्सक्राइब करने के लिए किसी भी अलर्ट पर STOP भेजें।'
    },
    mr:{
      brandTag:'मोफत SMS आणि WhatsApp',
      title:'नियम व अटी',
      meta:'लागू: 9 जुलै 2026',
      content:
        '<h2>1. सेवा</h2>'+
        '<p>लाइव्हस्कोर अलर्ट्स SMS आणि WhatsApp वर लाइव्ह क्रिकेट आणि फुटबॉल स्कोर पाठवते. अलर्ट मिळवणे मोफत आहे.</p>'+
        '<h2>2. सबस्क्रिप्शन</h2>'+
        '<p>साइन-अप आमच्या होम पेजवरील लिंकद्वारे पूर्ण होते. सबस्क्राईब करून तुम्ही दिलेल्या मोबाईल नंबरवर स्कोर अलर्ट घेण्यास संमती देता, आणि तो नंबर तुमचाच आहे याची पुष्टी करता.</p>'+
        '<h2>3. शुल्क</h2>'+
        '<p>अलर्टसाठी आम्ही कोणतेही शुल्क घेत नाही. तुम्ही पाठवलेल्या मेसेजवर (उदा. STOP) तुमच्या ऑपरेटरचे नेहमीचे शुल्क लागू शकते. WhatsApp मेसेज तुमचा डेटा वापरतात.</p>'+
        '<h2>4. अचूकता आणि उपलब्धता</h2>'+
        '<p>स्कोर पूर्ण प्रयत्नाने पाठवले जातात, तरीही कधीकधी उशीर, खंड किंवा चूक होऊ शकते. जिथे वेळेला आर्थिक महत्त्व आहे तिथे अलर्टवर अवलंबून राहू नका. उशिरा किंवा चुकीच्या स्कोरमुळे झालेल्या नुकसानाची जबाबदारी आम्ही घेत नाही. लाइव्हस्कोर अलर्ट्स ही स्वतंत्र सेवा आहे आणि कोणत्याही लीग, बोर्ड, संघ किंवा ब्रॉडकास्टरशी संलग्न नाही.</p>'+
        '<h2>5. योग्य वापर</h2>'+
        '<p>सेवेचा वापर कोणत्याही बेकायदेशीर कामासाठी करू नका, आणि अलर्टमधील मजकूर विकू नका किंवा व्यावसायिक कारणासाठी पुढे पाठवू नका.</p>'+
        '<h2>6. ऑप्ट-आउट</h2>'+
        '<p>सर्व मेसेज लगेच बंद करण्यासाठी कोणत्याही अलर्टला <b>STOP</b> पाठवा.</p>'+
        '<h2>7. बदल</h2>'+
        '<p>आम्ही वेळोवेळी या अटी बदलू शकतो. या पेजवर प्रकाशित आवृत्तीच लागू असते. बदलानंतर सेवेचा वापर सुरू ठेवणे म्हणजे तुम्ही नव्या अटी स्वीकारता.</p>'+
        '<h2>8. संपर्क</h2>'+
        '<p>या अटींबद्दल प्रश्न: <a href="mailto:support@yourdomain.com">support@yourdomain.com</a></p>',
      back:'‹ होमवर परत',
      footCopy:'© 2026 लाइव्हस्कोर अलर्ट्स. सर्व हक्क राखीव.',
      footStop:'अनसबस्क्राईब करण्यासाठी कोणत्याही अलर्टला STOP पाठवा.'
    }
  };
  function setLang(l){
    if(!I18N[l])l='en';
    var t=I18N[l];
    document.documentElement.lang=l;
    try{localStorage.setItem('lsa-lang',l);}catch(e){}
    var els=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<els.length;i++){
      var k=els[i].getAttribute('data-i18n');
      if(t[k]!==undefined)els[i].innerHTML=t[k];
    }
    var btns=document.querySelectorAll('.lang button');
    for(var b=0;b<btns.length;b++){
      btns[b].classList.toggle('on',btns[b].getAttribute('data-lang')===l);
    }
  }
  document.getElementById('lang-switch').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');
    if(b)setLang(b.getAttribute('data-lang'));
  });
  var saved=null;
  try{saved=localStorage.getItem('lsa-lang');}catch(e){}
  setLang(saved||'en');
</script>
</body>
</html>
